# Draws the contribution graph as a snake animation in the profile's green palette
# and publishes the SVGs to the `output` branch, which the README links to.
name: Snake animation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#2D6A4F&color_dots=#EBEDF0,#D8F3DC,#A8D5BA,#74C69D,#2D6A4F
            dist/snake-dark.svg?palette=github-dark&color_snake=#A8D5BA&color_dots=#161B22,#1B4332,#2D6A4F,#52796F,#74C69D

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
